# Generated by `python -m fleet render` from fleet.toml. Do not edit: change fleet.toml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fleet
  namespace: flux-system
spec:
  interval: "30s"
  url: "http://fleet-git:3000/fleet/fleet.git"
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: operators
  namespace: flux-system
spec:
  interval: "1m"
  retryInterval: "20s"
  timeout: "15m"
  path: "./clusters/prod/operators"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: fleet
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: config
  namespace: flux-system
spec:
  interval: "1m"
  retryInterval: "20s"
  timeout: "15m"
  path: "./clusters/prod/config"
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: fleet
  dependsOn:
  - name: operators
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lifecycle
  namespace: flux-system
spec:
  interval: "1m"
  retryInterval: "20s"
  timeout: "15m"
  path: "./clusters/prod/lifecycle"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: fleet
