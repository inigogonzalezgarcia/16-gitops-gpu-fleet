# Generated by `python -m fleet render` from fleet.toml. Do not edit: change fleet.toml.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: gpu-node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-agent
    spec:
      hostNetwork: true
      nodeSelector:
        fleet.lab/gpu: "true"
      tolerations:
      - operator: Exists
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: agent
        image: "gpu-lifecycle:a879ef9"
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/node-agent
        args:
        - "-listen=:9500"
        - "-version=580.126.20"
        - "-install-delay=3s"
        - "-bad-versions=595.91.07-lab-bad"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9500
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            memory: "32Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
